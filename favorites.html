<!DOCTYPE html>
<html>
<head>
    <title>Favorite Brands</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<div class="fashion-header">
    <h1>&#10084;&#65039; Favorite Brands</h1>
</div>

<!-- brand box -->
<div class="brands-header"></div>

<button class="gohome-btn"
        onclick="window.location.href='index.html'">
    &#127968; Home
</button>

</div>



<div id="favoritesContainer"></div>

<script>
    // ======================================
    // ❤️ Favorite Brands (localStorage)
    // ======================================
    const container = document.getElementById("favoritesContainer");
    const userId = localStorage.getItem("userId");

    if (!userId) {
        container.innerHTML = `
            <h2 style="text-align:center;margin-top:80px;">
                &#128274; Please Login First
            </h2>
        `;
    } else {
        loadFavorites();
    }

    // ======================================
    // Load Favorites
    // ======================================
    function loadFavorites() {
        const allFavorites = JSON.parse(localStorage.getItem("favorites")) || [];
        const userFavorites = allFavorites.filter(brand => brand.userId === userId);

        container.innerHTML = "";

        if (userFavorites.length === 0) {
            container.innerHTML =
                "<h2>No Favorite Brands Yet &#10084;&#65039;</h2>";
            return;
        }

        userFavorites.forEach(brand => {
            const brandName = brand.brandName || brand.name;
            const brandImage = brand.image || brand.logo;

            container.innerHTML += `
                <div class="brand-box">
                    <img src="${brandImage}" alt="${brandName}">
                    <h3>${brandName}</h3>
                    <button onclick="removeFavorite(${brand.id})">
                        Remove
                    </button>
                    <button onclick="openBrand('${brand.website}')">
                        Visit Brand
                    </button>
                </div>
            `;
        });
    }

    // ======================================
    // Visit Brand
    // ======================================
    function openBrand(link) {
        window.open(link, "_blank");
    }

    // ======================================
    // Remove Favorite
    // ======================================
    function removeFavorite(id) {
        let allFavorites = JSON.parse(localStorage.getItem("favorites")) || [];
        allFavorites = allFavorites.filter(brand => brand.id !== id);
        localStorage.setItem("favorites", JSON.stringify(allFavorites));
        loadFavorites();
    }

    // ======================================
    // Apply Theme on Page Load
    // ======================================
    window.addEventListener("load", () => {
        const theme = localStorage.getItem("theme");
        if (theme === "dark") {
            document.body.classList.add("dark-mode");
        }
    });
</script>

</body>
</html>
