    <!-- web page -->
    <!-- Website Viewer -->
    <div id="website-container" style="display:none;"></div>

    <div class="top-buttons"></div>

    <div class="left-buttons"></div>



    <div id="toast"></div>

<script>
    // ======================================
    // ❤️ Add / Remove Favorite (localStorage)
    // ======================================
    function addFavorite(event, name, image, link) {
        event.stopPropagation();

        const button = event.target;
        const userId = localStorage.getItem("userId");

        // Check Login
        if (!userId) {
            alert("Please Login First!");
            return;
        }

        // Get existing favorites from localStorage
        let favorites = JSON.parse(localStorage.getItem("favorites")) || [];

        // ============================
        // Remove Favorite
        // ============================
        if (button.classList.contains("active")) {
            favorites = favorites.filter(
                fav => !(fav.userId === userId && fav.brandName === name)
            );
            localStorage.setItem("favorites", JSON.stringify(favorites));

            button.classList.remove("active");
            delete button.dataset.favoriteId;
            showMessage(name + " removed from Favorites 💔");
            return;
        }

        // ============================
        // Add Favorite
        // ============================
        const newFavorite = {
            id: Date.now(),
            userId: userId,
            name: name,
            brandName: name,
            logo: image,
            image: image,
            website: link
        };

        favorites.push(newFavorite);
        localStorage.setItem("favorites", JSON.stringify(favorites));

        button.classList.add("active");
        button.dataset.favoriteId = newFavorite.id;
        showMessage(name + " added to Favorites ❤️");
    }

    // ======================================
    // Toast Message
    // ======================================
    function showMessage(message) {
        const toast = document.getElementById("toast");
        if (!toast) return;
        toast.textContent = message;
        toast.classList.add("show");

        setTimeout(() => {
            toast.classList.remove("show");
        }, 2000);
    }

    // ======================================
    // Load Favorite Hearts (localStorage)
    // ======================================
    window.addEventListener("load", () => {
        const userId = localStorage.getItem("userId");
        if (!userId) return;

        const allFavorites = JSON.parse(localStorage.getItem("favorites")) || [];
        const userFavorites = allFavorites.filter(f => f.userId === userId);

        document.querySelectorAll(".heart-btn").forEach(btn => {
            const brandBox = btn.closest(".brand-box");
            const brandName = brandBox.querySelector("h3").innerText;
            const fav = userFavorites.find(f => f.brandName === brandName);

            if (fav) {
                btn.classList.add("active");
                btn.dataset.favoriteId = fav.id;
            }
        });
    });

    // ======================================
    // Save History (localStorage)
    // ======================================
    function saveHistory(name, image, website) {
        const userId = localStorage.getItem("userId");
        if (!userId) return;

        const now = new Date();
        const dateStr = now.toLocaleDateString();
        const timeStr = now.toLocaleTimeString();
        const history = JSON.parse(localStorage.getItem("history")) || [];

        const newEntry = {
            id: Date.now(),
            userId: userId,
            name: name,
            brandName: name,
            logo: image,
            image: image,
            website: website,
            date: dateStr,
            visitDate: dateStr,
            time: timeStr,
            visitTime: timeStr
        };

        history.push(newEntry);
        localStorage.setItem("history", JSON.stringify(history));
    }

    // ======================================
    // Open Brand
    // ======================================
    function openBrand(name, image, website) {
        saveHistory(name, image, website);
        window.location.href = website;
    }

    // ======================================
    // Apply Theme on Page Load
    // ======================================
    window.addEventListener("load", () => {
        const theme = localStorage.getItem("theme");
        if (theme === "dark") {
            document.body.classList.add("dark-mode");
        }
    });
</script>
